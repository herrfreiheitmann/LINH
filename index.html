  <svg class="esfera-linh" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 64 85" aria-hidden="true" focusable="false">
    <style>
      .esfera-linh {
        position: fixed;
        left: max(.75rem, env(safe-area-inset-left));
        bottom: max(.75rem, env(safe-area-inset-bottom));
        z-index: 4;
        width: clamp(2.5rem, 5vw, 3.75rem);
        height: auto;
        pointer-events: none;
        filter: drop-shadow(0 2px 4px #0008);
      }

      .esfera-linh .gota {
        opacity: 0;
        animation: gota-linh 8s linear infinite;
      }

      .esfera-linh .gota-tardia {
        animation-delay: .5s;
      }

      @keyframes gota-linh {
        0%, 73% { opacity: 0; transform: translateY(0); }
        75% { opacity: 1; transform: translateY(0); }
        83% { opacity: 1; transform: translateY(15px); }
        87%, 100% { opacity: 0; transform: translateY(21px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .esfera-linh .gota { animation: none; }
      }
    </style>

    <defs>
      <radialGradient id="luz-esfera-linh" cx="32%" cy="26%" r="75%">
        <stop stop-color="#fff"/>
        <stop offset=".5" stop-color="#ccc"/>
        <stop offset="1" stop-color="#484848"/>
      </radialGradient>
    </defs>

    <circle cx="32" cy="30" r="25"
            fill="url(#luz-esfera-linh)" stroke="#eee" stroke-width="1"/>

    <g fill="none" stroke="#161616" stroke-width="1" opacity=".8">
      <ellipse cx="32" cy="30" rx="17" ry="25"/>
      <ellipse cx="32" cy="30" rx="8" ry="25"/>
      <path d="M32 5v50 M7 30c11 9 39 9 50 0
               M11 17c10 7 32 7 42 0
               M11 43c10 7 32 7 42 0"/>

    <g fill="#090909" stroke="#777" stroke-width=".65">
      <path class="gota" d="M27 53c0 3-3 5-3 8a3 3 0 0 0 6 0c0-3-3-5-3-8z"/>
      <path class="gota gota-tardia"
            d="M39 52c0 2-2 4-2 6a2 2 0 0 0 4 0c0-2-2-4-2-6z"/>
    </g>
  </svg>
